name: dependabot-auto-merge
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - uses: amfaro/actions/dependabot-auto-merge@v1
