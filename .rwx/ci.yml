on:
  cli:
    init:
      commit-sha: ${{ event.git.sha }}

  github:
    pull_request:
      init:
        commit-sha: ${{ event.git.sha }}

    push:
      if: ${{ event.git.branch == 'main' }}
      init:
        commit-sha: ${{ event.git.sha }}

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: code
    call: git/clone 2.2.0
    with:
      repository: https://github.com/amfaro/llm-usage.git
      ref: ${{ init.commit-sha }}

  - key: rust-only
    use: code
    filter:
      - mise.toml
    run: echo rust > "$RWX_ENV/MISE_ENABLE_TOOLS"

  - key: tools
    use: rust-only
    call: mise/install 1.1.1
    filter:
      - mise.toml

  - key: build-check
    use: tools
    run: |
      mise run check
      mise run test
      mise run fmt
      mise run clippy
