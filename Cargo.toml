[package]
name = "llm-usage"
version = "0.1.0"
edition = "2024"
description = "Standalone subscription quota dashboard for Codex, OpenCode Go, and Claude Code"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"
serde_json = "1.0"
